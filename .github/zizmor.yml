# zizmor config for this repository. Each ignore names one audit and one file,
# with the reason. Composite actions cannot be ignored here; their ignores are
# inline comments next to the finding.
rules:
  dependabot-cooldown:
    ignore:
      # dependabot.yml is synced from thaw-app/platform (config/repos.yaml), so a
      # cooldown added here is overwritten. Set it there for every repository.
      - dependabot.yml
  superfluous-actions:
    ignore:
      # The two release steps use softprops/action-gh-release to create draft
      # releases with assets. Moving them to gh release would rewrite the
      # release path for an informational finding.
      - release-macos-app.yml
  self-repository:
    ignore:
      # zizmor.yml runs ./actions/zizmor from its checkout. actionlint 1.7.12,
      # the latest release, rejects the $/actions/zizmor form.
      - zizmor.yml
