name: zizmor

on:
  push:
    branches: [main]
    paths:
      - "actions/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".github/zizmor.yml"
  pull_request:
    paths:
      - "actions/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".github/zizmor.yml"

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    if: github.repository == 'thaw-app/org-ci'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Uploads the SARIF report to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # SARIF output never fails on a finding. A fork's pull request and
      # Dependabot get a token that cannot write security events.
      - name: Upload findings to code scanning
        if: >-
          ${{
            github.actor != 'dependabot[bot]'
            && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
          }}
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.32.0"

      - name: Audit workflows and actions
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.32.0"
          advanced-security: false
          annotations: true
