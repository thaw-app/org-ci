name: zizmor

on:
  push:
    branches: [main]
    paths:
      - "actions/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".github/zizmor.yml"
  pull_request:
    paths:
      - "actions/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".github/zizmor.yml"

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    if: github.repository == 'thaw-app/org-ci'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Uploads the SARIF report to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action from this checkout, so a pull request that changes it audits with its own version.
      - uses: ./actions/zizmor
