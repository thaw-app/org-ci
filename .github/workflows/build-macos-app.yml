name: Build macOS app

# Builds, signs and notarizes a macOS app in one job here, away from the
# calling workflow, then attests the result in a second job that runs none of
# the app's code. The provenance names this file as the builder, which is what
# takes a release from SLSA v1.0 Build L2 to Build L3: the caller chooses what
# to build, not how, and the build phases never see the identity that signs
# the provenance.
# Verify a download with
#
#   gh attestation verify App.dmg --owner <org> \
#     --signer-workflow thaw-app/org-ci/.github/workflows/build-macos-app.yml
#
# The provenance names the commit that triggered the caller, so that is the
# commit this workflow builds when it attests: dispatch a release on its tag,
# not on a branch with the tag as an input. With attest off, as for a dry run
# or a development build, any ref builds; the signing secrets are in the job
# either way, so callers build only refs they trust. The caller downloads the
# artifact this workflow uploads and finishes the release itself, or calls
# release-macos-app.yml to do it.

on:
  workflow_call:
    inputs:
      ref:
        description: >-
          Git ref of the caller to build. Empty builds the commit that
          triggered the caller. With attest on, another ref is accepted only
          when it names that same commit, such as the tag the run was
          dispatched on, because the provenance records the triggering commit.
        required: false
        type: string
        default: ""
      version:
        description: >-
          Version the ref carries, for example 1.2.3. Names the SBOM and the
          artifact. Empty names them after the built commit, dev-<short sha>.
        required: false
        type: string
        default: ""
      project-name:
        description: Xcode project relative to the checkout, for example App.xcodeproj
        required: true
        type: string
      target-name:
        description: App target whose Release deployment target is used
        required: true
        type: string
      scheme-name:
        description: Xcode scheme to archive
        required: true
        type: string
      app-name:
        description: Name of the .app bundle, for example App.app
        required: true
        type: string
      dmg-name:
        description: Name of the DMG to produce, for example App.dmg
        required: true
        type: string
      asset-prefix:
        description: Prefix of the SBOM file name (Prefix_version.cdx.json)
        required: true
        type: string
      environment:
        description: >-
          The caller's environment that holds the signing secrets. Its
          protection rules apply before any secret is read.
        required: true
        type: string
      runner:
        description: Runner label with the Xcode the app needs
        required: false
        type: string
        default: macos-latest
      xcode-version:
        description: Passed to setup-xcode; latest includes betas
        required: false
        type: string
        default: latest
      prepare-script:
        description: >-
          Script inside the checkout to run with sh before the build, for a
          tool the project's build phases need. ~/.local/bin is put on PATH
          afterwards when it exists. Empty runs nothing.
        required: false
        type: string
        default: ""
      build-settings:
        description: Extra xcodebuild settings, one NAME=value per line
        required: false
        type: string
        default: ""
      bundle-identifier:
        description: Bundle identifier of the app, needed with a provisioning profile
        required: false
        type: string
        default: ""
      attest:
        description: >-
          Attest the DMG and the SBOM in a second job. Off for dry runs: an
          attestation is a permanent public record.
        required: false
        type: boolean
        default: true
      retention-days:
        description: Days the build artifact is kept
        required: false
        type: number
        default: 7
    # Named like the caller's secrets: a `uses:` job cannot set an environment,
    # so environment secrets only arrive through `secrets: inherit`, which
    # matches them by name.
    secrets:
      APPLE_APPLICATION_CERT:
        description: Base64-encoded Developer ID Application certificate (.p12)
        required: true
      APPLE_APPLICATION_CERT_PASSWORD:
        description: Password of the .p12
        required: true
      APPLE_ID:
        description: Apple ID for notarytool
        required: true
      APPLE_ID_PASSWORD:
        description: App-specific password of that Apple ID
        required: true
      APPLE_TEAM_ID:
        description: Apple Developer Team ID
        required: true
      PROVISIONING_PROFILE:
        description: Base64-encoded Developer ID provisioning profile, when the app needs one
        required: false
    outputs:
      commit:
        description: Commit that was built
        value: ${{ jobs.build.outputs.commit }}
      version:
        description: Version that named the SBOM and the artifact
        value: ${{ jobs.build.outputs.version }}
      artifact-name:
        description: Workflow artifact holding the DMG, SBOM, checksums and app ZIP
        value: ${{ jobs.build.outputs.artifact-name }}
      provenance-artifact-name:
        description: Workflow artifact holding the attestation bundles, empty when attest was off
        value: ${{ jobs.attest.outputs.artifact-name }}
      app-zip-name:
        description: File name of the exported app ZIP inside the artifact (unzip with ditto)
        value: ${{ jobs.build.outputs.app-zip-name }}
      dmg-name:
        description: File name of the DMG
        value: ${{ jobs.build.outputs.dmg-name }}
      dmg-digest:
        description: sha256:<hex> of the DMG
        value: ${{ jobs.build.outputs.dmg-digest }}
      dmg-bundle-name:
        description: File name of the DMG attestation bundle, empty when attest was off
        value: ${{ jobs.attest.outputs.dmg-bundle-name }}
      sbom-name:
        description: File name of the CycloneDX SBOM
        value: ${{ jobs.build.outputs.sbom-name }}
      sbom-digest:
        description: sha256:<hex> of the SBOM
        value: ${{ jobs.build.outputs.sbom-digest }}
      sbom-bundle-name:
        description: File name of the SBOM attestation bundle, empty when attest was off
        value: ${{ jobs.attest.outputs.sbom-bundle-name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    # No id-token here: the prepare script and build phases run in this job
    # and must not reach the identity that signs provenance.
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      artifact-name: ${{ steps.names.outputs.artifact-name }}
      app-zip-name: ${{ steps.names.outputs.app-zip-name }}
      dmg-name: ${{ inputs.dmg-name }}
      dmg-digest: ${{ steps.digests.outputs.dmg-digest }}
      sbom-name: ${{ steps.sbom.outputs.name }}
      sbom-digest: ${{ steps.digests.outputs.sbom-digest }}
    steps:
      # The names end up in file paths, artifact path lists and attestation
      # subjects, so they must be plain file names.
      - name: Check inputs
        env:
          APP_NAME: ${{ inputs.app-name }}
          DMG_NAME: ${{ inputs.dmg-name }}
          ASSET_PREFIX: ${{ inputs.asset-prefix }}
        run: |
          set -euo pipefail
          if [[ ! "$APP_NAME" =~ ^[A-Za-z0-9_][A-Za-z0-9._\ -]*\.app$ ]]; then
            echo "::error::app-name must be a plain bundle name ending in .app, got: ${APP_NAME}"
            exit 1
          fi
          if [[ ! "$DMG_NAME" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*\.dmg$ ]]; then
            echo "::error::dmg-name must be a plain file name ending in .dmg, got: ${DMG_NAME}"
            exit 1
          fi
          if [[ ! "$ASSET_PREFIX" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::asset-prefix must be file-name safe, got: ${ASSET_PREFIX}"
            exit 1
          fi

      # The caller is checked out, not this repository, so the actions below
      # are pinned like a caller pins them.
      - name: Checkout source
        id: source
        uses: thaw-app/org-ci/actions/checkout-source@dedf96e25ba6d24867c18e706b8bd9f6b1fb09d0
        with:
          project-name: ${{ inputs.project-name }}
          target-name: ${{ inputs.target-name }}
          ref: ${{ inputs.ref }}
          local-actions-path: ""

      # attest-build-provenance names the triggering commit as the source whatever
      # was checked out, so an attested build of another commit stops here.
      - name: Check the built commit is the one the provenance names
        id: commit
        env:
          ATTEST: ${{ inputs.attest }}
          RUN_COMMIT: ${{ github.sha }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # Read from the checkout itself, not from an output another step wrote.
          built_commit="$(git rev-parse HEAD)"
          if [[ "$ATTEST" == "true" && "$built_commit" != "$RUN_COMMIT" ]]; then
            echo "::error::ref '${REF}' is ${built_commit}, but this run was triggered from ${RUN_COMMIT}, which is what the provenance would name. Run the caller on the ref to build, for example: gh workflow run release.yml --ref <tag>"
            exit 1
          fi
          echo "commit=${built_commit}" >> "$GITHUB_OUTPUT"
          echo "Building ${built_commit}"

      - name: Resolve version
        id: version
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          set -euo pipefail
          if [[ -z "$VERSION" ]]; then
            VERSION="dev-${COMMIT:0:7}"
          fi
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::version must be file-name safe, got: ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version ${VERSION}"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ inputs.xcode-version }}

      # Before the prepare script: it may put tools on PATH, and this is the
      # one step that handles the raw signing secrets.
      - name: Configure signing
        id: signing
        uses: thaw-app/org-ci/actions/configure-signing@dedf96e25ba6d24867c18e706b8bd9f6b1fb09d0
        with:
          apple-application-cert: ${{ secrets.APPLE_APPLICATION_CERT }}
          apple-application-cert-password: ${{ secrets.APPLE_APPLICATION_CERT_PASSWORD }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-id-password: ${{ secrets.APPLE_ID_PASSWORD }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          provisioning-profile: ${{ secrets.PROVISIONING_PROFILE }}

      - name: Run prepare script
        if: inputs.prepare-script != ''
        env:
          PREPARE_SCRIPT: ${{ inputs.prepare-script }}
        run: |
          set -euo pipefail
          if [[ "$PREPARE_SCRIPT" == /* || "/$PREPARE_SCRIPT/" == */../* ]]; then
            echo "::error::prepare-script must be a path inside the checkout, got: $PREPARE_SCRIPT"
            exit 1
          fi
          if [[ ! -f "$PREPARE_SCRIPT" ]]; then
            echo "No $PREPARE_SCRIPT at this ref; nothing to prepare"
            exit 0
          fi
          sh "$PREPARE_SCRIPT"
          if [[ -d "$HOME/.local/bin" ]]; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Build
        uses: thaw-app/org-ci/actions/build@dedf96e25ba6d24867c18e706b8bd9f6b1fb09d0
        with:
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          project-name: ${{ steps.source.outputs.project-name }}
          scheme-name: ${{ inputs.scheme-name }}
          deployment-target: ${{ steps.source.outputs.deployment-target }}
          build-settings: ${{ inputs.build-settings }}

      - name: Export archive and package DMG
        uses: thaw-app/org-ci/actions/export-and-package@dedf96e25ba6d24867c18e706b8bd9f6b1fb09d0
        with:
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          app-name: ${{ inputs.app-name }}
          dmg-name: ${{ inputs.dmg-name }}
          provisioning-profile-name: ${{ steps.signing.outputs.provisioning-profile-name }}
          bundle-identifier: ${{ inputs.bundle-identifier }}

      - name: Notarize DMG
        uses: thaw-app/org-ci/actions/notarize-and-validate@dedf96e25ba6d24867c18e706b8bd9f6b1fb09d0
        with:
          dmg-name: ${{ inputs.dmg-name }}
          app-name: ${{ inputs.app-name }}

      - name: Generate CycloneDX SBOM
        id: sbom
        env:
          ASSET_PREFIX: ${{ inputs.asset-prefix }}
          VERSION: ${{ steps.version.outputs.version }}
          # Syft pinned by version and archive digest; bump both from the
          # release's syft_<version>_checksums.txt.
          SYFT_VERSION: 1.42.3
          SYFT_SHA256_DARWIN_ARM64: d71ee7db2be0fe2e96f679fd9d69ef04274cc86c8604707797080a21070b3f32
          SYFT_SHA256_DARWIN_AMD64: c00d01b7c43504708c8922d643d1cbaefa62ca8876baa4d2c2cf4c3be43707a9
        run: |
          set -euo pipefail
          if [[ ! "$ASSET_PREFIX" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::asset-prefix must be file-name safe, got: ${ASSET_PREFIX}"
            exit 1
          fi

          case "$(uname -m)" in
            arm64) syft_arch=arm64; syft_sha="$SYFT_SHA256_DARWIN_ARM64" ;;
            x86_64) syft_arch=amd64; syft_sha="$SYFT_SHA256_DARWIN_AMD64" ;;
            *) echo "Unsupported runner architecture: $(uname -m)"; exit 1 ;;
          esac

          bin="$RUNNER_TEMP/syft-bin"
          archive="$RUNNER_TEMP/syft.tar.gz"
          mkdir -p "$bin"
          curl --proto '=https' --tlsv1.2 -sSfL --retry 3 \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_darwin_${syft_arch}.tar.gz" \
            -o "$archive"
          echo "${syft_sha}  ${archive}" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$bin" syft
          export PATH="$bin:$PATH"
          syft version

          # The source tree, not the app: SwiftPM dependencies are linked
          # statically, so only Package.resolved lists them. create-dmg and
          # brand-assets are export-and-package's checkouts, not the app's.
          name="${ASSET_PREFIX}_${VERSION}.cdx.json"
          syft scan dir:. \
            --exclude './build/**' \
            --exclude './.git/**' \
            --exclude './.github/**' \
            --exclude './create-dmg/**' \
            --exclude './brand-assets/**' \
            --source-name "$ASSET_PREFIX" \
            --source-version "$VERSION" \
            -o "cyclonedx-json=build/${name}"
          test -f "build/${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Write checksums
        id: digests
        env:
          DMG_NAME: ${{ inputs.dmg-name }}
          SBOM_NAME: ${{ steps.sbom.outputs.name }}
        run: |
          set -euo pipefail
          # Basename-only lines, so `shasum -c` works beside the downloaded assets.
          cd build
          shasum -a 256 "$DMG_NAME" | tee "${DMG_NAME}.sha256"
          shasum -a 256 "$SBOM_NAME" | tee "${SBOM_NAME}.sha256"
          {
            echo "dmg-digest=sha256:$(awk '{print $1}' "${DMG_NAME}.sha256")"
            echo "sbom-digest=sha256:$(awk '{print $1}' "${SBOM_NAME}.sha256")"
          } >> "$GITHUB_OUTPUT"

      # ditto keeps the bundle's symlinks and resource forks, which a plain
      # artifact upload would not, so the caller gets back an app that still
      # passes codesign and carries its notarization ticket.
      - name: Zip exported app
        id: names
        env:
          APP_NAME: ${{ inputs.app-name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          zip_name="${APP_NAME}.zip"
          rm -f "build/${zip_name}"
          ditto -c -k --sequesterRsrc --keepParent "build/Export/${APP_NAME}" "build/${zip_name}"
          {
            echo "app-zip-name=${zip_name}"
            echo "artifact-name=build-${VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.names.outputs.artifact-name }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
          path: |
            build/${{ inputs.dmg-name }}
            build/${{ inputs.dmg-name }}.sha256
            build/${{ steps.sbom.outputs.name }}
            build/${{ steps.sbom.outputs.name }}.sha256
            build/${{ steps.names.outputs.app-zip-name }}

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/buildagent.keychain" || true

  # The only job with the identity that signs provenance. It runs none of the
  # app's code and attests the digests the build job reported.
  attest:
    needs: build
    if: inputs.attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact-name: ${{ steps.bundles.outputs.artifact-name }}
      dmg-bundle-name: ${{ steps.bundles.outputs.dmg-bundle-name }}
      sbom-bundle-name: ${{ steps.bundles.outputs.sbom-bundle-name }}
    env:
      DMG_NAME: ${{ needs.build.outputs.dmg-name }}
      SBOM_NAME: ${{ needs.build.outputs.sbom-name }}
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: build

      - name: Check the files against the reported digests
        env:
          DMG_DIGEST: ${{ needs.build.outputs.dmg-digest }}
          SBOM_DIGEST: ${{ needs.build.outputs.sbom-digest }}
        run: |
          set -euo pipefail
          cd build
          shasum -a 256 -c "${DMG_NAME}.sha256"
          shasum -a 256 -c "${SBOM_NAME}.sha256"
          test "sha256:$(shasum -a 256 "$DMG_NAME" | awk '{print $1}')" = "$DMG_DIGEST"
          test "sha256:$(shasum -a 256 "$SBOM_NAME" | awk '{print $1}')" = "$SBOM_DIGEST"

      # By digest, not by path: the subject is exactly the file checked above,
      # and a name can never be read as a pattern.
      - name: Attest DMG
        id: attest-dmg
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.build.outputs.dmg-name }}
          subject-digest: ${{ needs.build.outputs.dmg-digest }}

      - name: Attest SBOM
        id: attest-sbom
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.build.outputs.sbom-name }}
          subject-digest: ${{ needs.build.outputs.sbom-digest }}

      # Named after their subject, so a release carries App.dmg.intoto.jsonl
      # next to App.dmg.
      - name: Stage attestation bundles
        id: bundles
        env:
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact-name }}
          DMG_BUNDLE_PATH: ${{ steps.attest-dmg.outputs.bundle-path }}
          SBOM_BUNDLE_PATH: ${{ steps.attest-sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -f "$DMG_BUNDLE_PATH"
          test -f "$SBOM_BUNDLE_PATH"
          mkdir -p provenance
          cp "$DMG_BUNDLE_PATH" "provenance/${DMG_NAME}.intoto.jsonl"
          cp "$SBOM_BUNDLE_PATH" "provenance/${SBOM_NAME}.intoto.jsonl"
          {
            echo "artifact-name=${ARTIFACT_NAME}-provenance"
            echo "dmg-bundle-name=${DMG_NAME}.intoto.jsonl"
            echo "sbom-bundle-name=${SBOM_NAME}.intoto.jsonl"
          } >> "$GITHUB_OUTPUT"

      - name: Upload provenance artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.bundles.outputs.artifact-name }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
          path: |
            provenance/${{ steps.bundles.outputs.dmg-bundle-name }}
            provenance/${{ steps.bundles.outputs.sbom-bundle-name }}
