# Kept in step with thaw-app/platform (defaults.dependabot in config/org.yaml).
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    assignees:
      - "diazdesandi"
    groups:
      bun:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    # The workflows, and the actions each composite action calls.
    directories:
      - "/"
      - "/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    assignees:
      - "diazdesandi"
    groups:
      github-actions:
        patterns:
          - "*"
