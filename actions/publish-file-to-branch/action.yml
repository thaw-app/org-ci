name: Publish File To Branch
description: >-
  Commit a single file onto a branch of a GitHub repository, retrying on push
  conflict. Used for appcast publishing (gh-pages) and legacy feed mirroring.

# One implementation of the clone / commit / retry-push loop. It previously
# existed three times: once here in sparkle-release, and twice in the Thaw
# release workflow (gh-pages appcast + legacy mirror), so a bug in the retry
# logic was a three-place fix.

inputs:
  repository:
    description: Target repository as owner/name
    required: true
  branch:
    description: Branch to publish onto (for example, gh-pages or main)
    required: true
  source-path:
    description: >-
      File to publish. Absolute, or relative to the workspace — the appcast
      generated by sparkle-release lives under RUNNER_TEMP, not the workspace.
    required: true
  destination-path:
    description: Path the file should take inside the target repository
    required: true
  token:
    description: Token with contents:write on the target repository
    required: true
  commit-message:
    description: Commit message for the publish commit
    required: true
  create-branch-if-missing:
    description: >-
      Create the branch as an orphan when it does not exist. Correct for a
      gh-pages feed; leave false for a branch that must already exist, so a
      typo cannot silently orphan a real branch.
    required: false
    default: "false"
  gitignore-allowlist:
    description: >-
      Newline-separated .gitignore body written when the branch has none, to
      keep a Pages branch to just the published file. Empty writes nothing.
      destination-path is staged with `git add --force`, so the allowlist does
      not have to name it.
    required: false
    default: ""
  max-attempts:
    description: Push attempts before failing, with linear backoff between them
    required: false
    default: "5"

outputs:
  pushed:
    description: "true when a commit was pushed, false when the file was unchanged"
    value: ${{ steps.publish.outputs.pushed }}

runs:
  using: composite
  steps:
    - name: Publish file
      id: publish
      shell: bash
      env:
        TARGET_REPO: ${{ inputs.repository }}
        TARGET_BRANCH: ${{ inputs.branch }}
        SOURCE_PATH: ${{ inputs.source-path }}
        DEST_PATH: ${{ inputs.destination-path }}
        TOKEN: ${{ inputs.token }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        CREATE_BRANCH: ${{ inputs.create-branch-if-missing }}
        GITIGNORE_ALLOWLIST: ${{ inputs.gitignore-allowlist }}
        MAX_ATTEMPTS: ${{ inputs.max-attempts }}
      run: |
        set -euo pipefail

        # A composite action does not fail when a caller omits an input marked
        # `required: true` — the runner substitutes an empty string, and the
        # failure surfaces later as an unrelated git error.
        for required in TARGET_REPO TARGET_BRANCH SOURCE_PATH DEST_PATH TOKEN COMMIT_MESSAGE; do
          if [[ -z "${!required// }" ]]; then
            echo "Required input is empty: ${required}"
            exit 1
          fi
        done

        if [[ ! "$MAX_ATTEMPTS" =~ ^[1-9][0-9]*$ ]]; then
          echo "max-attempts must be a positive integer, got: ${MAX_ATTEMPTS}"
          exit 1
        fi

        if [[ ! -f "$SOURCE_PATH" ]]; then
          echo "Missing source file: $SOURCE_PATH"
          exit 1
        fi

        # Distinct work dir per target so two publishes in one job cannot
        # collide on $RUNNER_TEMP.
        slug="$(printf '%s' "${TARGET_REPO}-${TARGET_BRANCH}" | tr -c 'A-Za-z0-9._-' '_')"
        work="$RUNNER_TEMP/publish-${slug}"

        # Credentials go in a header, not the remote URL. Git echoes the remote
        # URL in transport errors, and push stderr is surfaced below, so a
        # URL-embedded token can reach the log if it was never registered as an
        # Actions secret.
        remote="https://github.com/${TARGET_REPO}.git"
        auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"

        attempt=1
        while true; do
          rm -rf "$work"

          # Probe the branch instead of inferring it from a clone failure: a
          # bad token, a missing repository, a rate limit and a network error
          # all fail the same clone, and treating those as "branch missing"
          # both hides the real cause and sends the run down the orphan path.
          if ! heads="$(git -c "http.extraheader=${auth_header}" \
                ls-remote --heads "$remote" "$TARGET_BRANCH" 2>&1)"; then
            echo "Cannot reach ${TARGET_REPO}:"
            echo "$heads"
            exit 1
          fi

          if [[ -n "$heads" ]]; then
            git -c "http.extraheader=${auth_header}" \
              clone --depth 1 --branch "$TARGET_BRANCH" "$remote" "$work"
          elif [[ "$CREATE_BRANCH" == "true" ]]; then
            git -c "http.extraheader=${auth_header}" clone --depth 1 "$remote" "$work"
            git -C "$work" checkout --orphan "$TARGET_BRANCH"
            git -C "$work" rm -rf . >/dev/null 2>&1 || true
          else
            echo "Branch ${TARGET_BRANCH} does not exist on ${TARGET_REPO}."
            echo 'Set create-branch-if-missing: "true" to create it as an orphan.'
            exit 1
          fi

          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p "$(dirname "$work/$DEST_PATH")"
          cp "$SOURCE_PATH" "$work/$DEST_PATH"

          paths=("$DEST_PATH")
          if [[ -n "$GITIGNORE_ALLOWLIST" && ! -f "$work/.gitignore" ]]; then
            printf '%s\n' "$GITIGNORE_ALLOWLIST" > "$work/.gitignore"
            paths+=(.gitignore)
          fi

          # --force: destination-path is the file the caller explicitly asked to
          # publish, so an allowlist .gitignore that covers everything else must
          # not make `git add` fail on it.
          git -C "$work" add --force -- "${paths[@]}"

          if git -C "$work" diff --staged --quiet; then
            echo "${DEST_PATH} unchanged on ${TARGET_REPO}@${TARGET_BRANCH}"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -C "$work" commit -m "$COMMIT_MESSAGE"

          if push_output="$(git -C "$work" -c "http.extraheader=${auth_header}" \
                push origin "HEAD:${TARGET_BRANCH}" 2>&1)"; then
            echo "$push_output"
            echo "Published ${DEST_PATH} to ${TARGET_REPO}@${TARGET_BRANCH}"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$push_output"

          # Only a race with another publisher is worth re-cloning for. A
          # missing contents:write, a protected branch or a rejected ref fails
          # identically on every attempt, so retrying buries the real cause
          # under a misleading "push conflict".
          if ! grep -qiE 'non-fast-forward|fetch first|\[rejected\]' <<<"$push_output"; then
            echo "Push to ${TARGET_BRANCH} failed for a reason a retry cannot fix."
            exit 1
          fi

          if [[ "$attempt" -ge "$MAX_ATTEMPTS" ]]; then
            echo "Failed to push ${TARGET_BRANCH} after ${MAX_ATTEMPTS} attempts"
            exit 1
          fi

          echo "push rejected (attempt ${attempt}/${MAX_ATTEMPTS}); refetching…"
          attempt=$((attempt + 1))
          sleep $((attempt * 2))
        done
