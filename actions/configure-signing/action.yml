name: Configure Signing
description: Set up keychain and import Developer ID signing certificate with notarytool credentials

inputs:
  apple-application-cert:
    description: Base64-encoded Developer ID Application certificate (.p12)
    required: true
  apple-application-cert-password:
    description: Password for the .p12 certificate
    required: true
  apple-id:
    description: Apple ID email for notarytool
    required: true
  apple-id-password:
    description: App-specific password for the Apple ID
    required: true
  apple-team-id:
    description: Apple Developer Team ID
    required: true
  keychain-path:
    description: Path for the temporary build keychain (must match notarize-and-validate)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Import certificate and store notarytool credentials
      shell: bash
      env:
        APPLE_APPLICATION_CERT: ${{ inputs.apple-application-cert }}
        APPLE_APPLICATION_CERT_PASSWORD: ${{ inputs.apple-application-cert-password }}
        APPLE_ID: ${{ inputs.apple-id }}
        APPLE_ID_PASSWORD: ${{ inputs.apple-id-password }}
        APPLE_TEAM_ID: ${{ inputs.apple-team-id }}
        KEYCHAIN_PATH_INPUT: ${{ inputs.keychain-path }}
      run: |
        set -euo pipefail
        if [[ -n "$KEYCHAIN_PATH_INPUT" ]]; then
          keychain="$KEYCHAIN_PATH_INPUT"
        else
          keychain="$RUNNER_TEMP/buildagent.keychain"
        fi
        keychain_password="$(openssl rand -base64 32)"
        security delete-keychain "$keychain" 2>/dev/null || true
        rm -f "$keychain" "$keychain"-db 2>/dev/null || true
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        existing=()
        while IFS= read -r line; do
          [[ -z "$line" ]] && continue
          existing+=("$line")
        done < <(security list-keychains -d user | tr -d '" ')
        # bash 3.2 + set -u: empty arrays are unbound; expand only when set.
        security list-keychains -d user -s "$keychain" ${existing[@]+"${existing[@]}"}
        cert_p12="$RUNNER_TEMP/cert.p12"
        base64 -D <<<"$APPLE_APPLICATION_CERT" > "$cert_p12"
        trap 'rm -f "$cert_p12"' EXIT
        security import "$cert_p12" -k "$keychain" \
          -P "$APPLE_APPLICATION_CERT_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S "apple-tool:,apple:,codesign:" \
          -s -k "$keychain_password" "$keychain"
        xcrun notarytool store-credentials "notarytool-profile" \
          --apple-id "$APPLE_ID" \
          --password "$APPLE_ID_PASSWORD" \
          --team-id "$APPLE_TEAM_ID" \
          --keychain "$keychain"
