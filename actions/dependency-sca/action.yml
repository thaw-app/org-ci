name: Dependency SCA
description: >-
  Scan lockfiles with OSV-Scanner and fail on a vulnerability that is not
  suppressed. Uploads the JSON report as an artifact and, outside pull requests,
  SARIF to code scanning.
  Run it after a checkout.

# The CLI is pinned by version and SHA-256. The scanner's own Action image cannot
# read a Swift Package.resolved.

inputs:
  lockfiles:
    description: Lockfiles to scan, one path per line. Every listed file must exist.
    required: true
  config:
    description: Path to the OSV-Scanner config that holds the suppressions
    required: false
    default: osv-scanner.toml
  policy-url:
    description: Link to the suppression rules, shown in the error when a suppression breaks them
    required: false
    default: https://github.com/thaw-app/.github/blob/main/.github/SECURITY.md#dependency-findings
  osv-scanner-version:
    description: OSV-Scanner release to install
    required: false
    default: "2.4.0"
  osv-scanner-sha256:
    description: SHA-256 of that release's osv-scanner_linux_amd64, from its osv-scanner_SHA256SUMS
    required: false
    default: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0

runs:
  using: composite
  steps:
    - name: Validate SCA suppressions
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        POLICY_URL: ${{ inputs.policy-url }}
      run: |
        set -euo pipefail
        if [[ ! -f "$CONFIG" ]]; then
          echo "::error::$CONFIG is missing"
          exit 1
        fi
        python3 "$GITHUB_ACTION_PATH/validate_suppressions.py" "$POLICY_URL" < "$CONFIG"

    - name: Install OSV-Scanner
      shell: bash
      env:
        OSV_SCANNER_VERSION: ${{ inputs.osv-scanner-version }}
        OSV_SCANNER_SHA256_LINUX_AMD64: ${{ inputs.osv-scanner-sha256 }}
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/osv-scanner-bin"
        mkdir -p "$bin"
        dest="$bin/osv-scanner"
        curl -sSfL --proto '=https' --tlsv1.2 --retry 3 \
          "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
          -o "$dest"
        echo "${OSV_SCANNER_SHA256_LINUX_AMD64}  ${dest}" | sha256sum -c -
        chmod +x "$dest"
        echo "$bin" >> "$GITHUB_PATH"
        "$dest" --version

    - name: Scan dependencies (OSV)
      shell: bash
      env:
        LOCKFILES: ${{ inputs.lockfiles }}
        CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        args=()
        while IFS= read -r lockfile; do
          [[ -n "$lockfile" ]] || continue
          if [[ ! -f "$lockfile" ]]; then
            echo "::error::lockfile $lockfile is missing"
            exit 1
          fi
          args+=("--lockfile=$lockfile")
        done <<< "$LOCKFILES"
        if [[ ${#args[@]} -eq 0 ]]; then
          echo "::error::lockfiles names no file to scan"
          exit 1
        fi

        # Always write reports, then exit with the scanner status so SARIF
        # upload can use if: always() while vulns still fail the job.
        set +e
        osv-scanner scan source \
          "${args[@]}" \
          --config="$CONFIG" \
          --format=json \
          --output-file=results.json
        json_ec=$?
        osv-scanner scan source \
          "${args[@]}" \
          --config="$CONFIG" \
          --format=sarif \
          --output-file=results.sarif
        sarif_ec=$?
        set -e

        if [[ ! -f results.json ]]; then
          echo "::error::OSV-Scanner did not produce results.json (exit=${json_ec})"
          exit 1
        fi

        # Prefer the JSON scan exit code (0 clean, 1 vulns, 128+ errors).
        if [[ "$json_ec" -ne 0 ]]; then
          exit "$json_ec"
        fi
        if [[ "$sarif_ec" -ne 0 && "$sarif_ec" -ne 1 ]]; then
          exit "$sarif_ec"
        fi
        exit 0

    # Not on a pull request: the job already fails on an unsuppressed finding,
    # and an upload there only adds a second check for the same scan. Scheduled
    # and manual runs keep the default branch's code scanning alerts current.
    - name: Upload SARIF
      if: >-
        ${{
          always()
          && !cancelled()
          && hashFiles('results.sarif') != ''
          && github.event_name != 'pull_request'
        }}
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        sarif_file: results.sarif
        category: dependency-sca

    - name: Upload JSON results
      if: ${{ always() && !cancelled() && hashFiles('results.json') != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: osv-scanner-results
        path: results.json
        retention-days: 14
