name: Close Stale Issues
description: Mark issues with no activity as stale, then close them. Pull requests are left alone.

inputs:
  days-before-stale:
    description: Days without activity before an issue is marked stale
    required: false
    default: "30"
  days-before-close:
    description: Days a stale issue stays open before it is closed
    required: false
    default: "7"
  stale-issue-label:
    description: Label put on a stale issue
    required: false
    default: stale
  exempt-issue-labels:
    description: Comma-separated labels that keep an issue from going stale
    required: false
    default: help wanted,keep open
  operations-per-run:
    description: Maximum number of API operations in one run
    required: false
    default: "100"

runs:
  using: composite
  steps:
    - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
      with:
        operations-per-run: ${{ inputs.operations-per-run }}
        days-before-stale: ${{ inputs.days-before-stale }}
        days-before-close: ${{ inputs.days-before-close }}
        days-before-pr-stale: -1
        days-before-pr-close: -1
        stale-issue-label: ${{ inputs.stale-issue-label }}
        stale-issue-message: "This issue has been automatically marked as stale due to inactivity."
        close-issue-message: "Closing this issue due to prolonged inactivity."
        exempt-issue-labels: ${{ inputs.exempt-issue-labels }}
