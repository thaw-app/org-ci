name: Sparkle Release
description: >-
  Package a notarized app ZIP and generate a signed appcast.xml. Publishing the
  result is the caller's job — see actions/publish-file-to-branch.

inputs:
  tag:
    description: Release tag / marketing version (for example, 2.0.0-rc.1)
    required: true
  channel:
    description: Sparkle channel (stable, beta, or alpha). Stable omits sparkle:channel.
    required: false
    default: stable
  app-name:
    description: Name of the .app bundle
    required: true
  asset-prefix:
    description: Release asset name prefix (ZIP becomes Prefix_tag.zip)
    required: true
  appcast-title:
    description: Title used when creating a new appcast stub
    required: true
  sparkle-version:
    description: Sparkle tools version (must match Package.resolved)
    required: false
    default: "2.9.3"
  sparkle-sha256:
    description: >-
      SHA-256 of Sparkle-<version>.tar.xz. Bump together with sparkle-version.
      generate_appcast runs with the EdDSA private key, so this archive is in
      the update-signing trust path and must not be fetched unverified.
    required: false
    default: 74a07da821f92b79310009954c0e15f350173374a3abe39095b4fc5096916be6
  sparkle-private-key:
    description: EdDSA private key contents matching SUPublicEDKey
    required: true
  previous-release-count:
    description: How many prior GitHub release ZIPs to fetch for delta generation
    required: false
    default: "3"
  publish-appcast:
    description: >-
      Removed. Publishing now lives in actions/publish-file-to-branch so the
      clone/commit/retry logic has one implementation and callers can push to
      more than one feed. Pass the appcast-path output to that action. Setting
      this to "true" fails rather than silently not publishing.
    required: false
    default: "false"
  export-path:
    description: Directory containing the exported .app
    required: false
    default: build/Export
  release-html-url:
    description: Override sparkle --link HTML URL (defaults to this repo's tag page)
    required: false
    default: ""
  updates-repository:
    description: >-
      Owner/name hosting Sparkle ZIP/delta releases and appcast Pages
      (for example, thaw-app/updates). Empty keeps feed + downloads on the
      caller repository (legacy).
    required: false
    default: ""
  updates-token:
    description: >-
      Token for reading the existing feed and prior ZIPs on updates-repository.
      Pass the same token to publish-file-to-branch, which needs
      contents:write, to push the generated appcast. Public reads may fall back
      to github.token.
    required: false
    default: ""

outputs:
  zip-path:
    description: Path to the Sparkle ZIP asset
    value: ${{ steps.package.outputs.zip-path }}
  zip-name:
    description: File name of the Sparkle ZIP asset
    value: ${{ steps.package.outputs.zip-name }}
  appcast-path:
    description: Path to the generated appcast.xml
    value: ${{ steps.appcast.outputs.appcast-path }}
  delta-glob:
    description: Glob of .delta files in the Sparkle archives directory (may include prior-release deltas)
    value: ${{ steps.appcast.outputs.delta-glob }}
  download-repository:
    description: Repository that hosts ZIP/delta download URLs for this run
    value: ${{ steps.meta.outputs.download-repository }}

runs:
  using: composite
  steps:
    - name: Resolve feed and download repositories
      id: meta
      shell: bash
      env:
        UPDATES_REPO: ${{ inputs.updates-repository }}
        UPDATES_TOKEN: ${{ inputs.updates-token }}
        PUBLISH_APPCAST: ${{ inputs.publish-appcast }}
        CALLER_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        # Unconditional: the default flipped from "true" to "false", so a
        # caller that never passed the input used to publish and now does not.
        # That change is invisible without a notice, because an omitted input
        # is indistinguishable from an explicit "false".
        echo "::notice::sparkle-release no longer publishes the appcast. \
        Push the appcast-path output with actions/publish-file-to-branch."

        if [[ "$PUBLISH_APPCAST" == "true" ]]; then
          echo "publish-appcast was removed from sparkle-release."
          echo "Publish the appcast-path output with:"
          echo "  uses: thaw-app/org-ci/actions/publish-file-to-branch@<sha>"
          exit 1
        fi

        if [[ -n "$UPDATES_REPO" ]]; then
          feed_repo="$UPDATES_REPO"
          download_repo="$UPDATES_REPO"
        else
          feed_repo="$CALLER_REPO"
          download_repo="$CALLER_REPO"
        fi

        {
          echo "feed-repository=$feed_repo"
          echo "download-repository=$download_repo"
        } >> "$GITHUB_OUTPUT"

        echo "feed=$feed_repo download=$download_repo"

    - name: Package notarized ZIP
      id: package
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
        TAG: ${{ inputs.tag }}
        ASSET_PREFIX: ${{ inputs.asset-prefix }}
        EXPORT_PATH: ${{ inputs.export-path }}
      run: |
        set -euo pipefail

        app_path="$EXPORT_PATH/$APP_NAME"
        if [[ ! -d "$app_path" ]]; then
          echo "Missing exported app at $app_path"
          exit 1
        fi

        # export-and-package already staples the app. Kept as a safety net for
        # callers running with notarize-app=false: the ticket from the DMG
        # notarization applies to the same CDHash, and re-stapling is idempotent.
        xcrun stapler staple "$app_path"
        xcrun stapler validate "$app_path"

        zip_name="${ASSET_PREFIX}_${TAG}.zip"
        zip_path="build/$zip_name"
        rm -f "$zip_path"
        ditto -c -k --sequesterRsrc --keepParent "$app_path" "$zip_path"

        echo "zip-name=$zip_name" >> "$GITHUB_OUTPUT"
        echo "zip-path=$zip_path" >> "$GITHUB_OUTPUT"
        ls -lh "$zip_path"

    - name: Install Sparkle tools
      shell: bash
      env:
        SPARKLE_VERSION: ${{ inputs.sparkle-version }}
        SPARKLE_SHA256: ${{ inputs.sparkle-sha256 }}
      run: |
        set -euo pipefail

        if [[ -z "$SPARKLE_SHA256" ]]; then
          echo "sparkle-sha256 must not be empty: generate_appcast runs with the"
          echo "EdDSA private key and this archive must be verified."
          exit 1
        fi

        tools_dir="$RUNNER_TEMP/sparkle-tools"
        rm -rf "$tools_dir"
        mkdir -p "$tools_dir"

        archive="$RUNNER_TEMP/Sparkle-${SPARKLE_VERSION}.tar.xz"
        curl -fsSL --retry 3 -o "$archive" \
          "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
        # Sparkle publishes no checksums file; this digest was recorded from the
        # published asset, which GitHub keeps immutable once a release exists.
        echo "${SPARKLE_SHA256}  ${archive}" | shasum -a 256 -c -
        tar -xJf "$archive" -C "$tools_dir"

        if [[ -x "$tools_dir/bin/generate_appcast" ]]; then
          sparkle_bin="$tools_dir/bin"
        elif [[ -x "$tools_dir/generate_appcast" ]]; then
          sparkle_bin="$tools_dir"
        else
          echo "generate_appcast not found in Sparkle archive"
          find "$tools_dir" -maxdepth 3 \( -type f -name 'generate_appcast' -o -name 'sign_update' \) | head
          exit 1
        fi

        echo "SPARKLE_BIN=$sparkle_bin" >> "$GITHUB_ENV"
        "$sparkle_bin/generate_appcast" --help | head -n 20 || true

    - name: Prepare archives and existing appcast
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        CHANNEL: ${{ inputs.channel }}
        ZIP_PATH: ${{ steps.package.outputs.zip-path }}
        PREVIOUS_COUNT: ${{ inputs.previous-release-count }}
        ASSET_PREFIX: ${{ inputs.asset-prefix }}
        APPCAST_TITLE: ${{ inputs.appcast-title }}
        FEED_REPO: ${{ steps.meta.outputs.feed-repository }}
        DOWNLOAD_REPO: ${{ steps.meta.outputs.download-repository }}
        CALLER_REPO: ${{ github.repository }}
        UPDATES_TOKEN: ${{ inputs.updates-token }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        archives="$RUNNER_TEMP/sparkle-archives"
        pages="$RUNNER_TEMP/gh-pages"
        rm -rf "$archives" "$pages"
        mkdir -p "$archives" "$pages"

        cp "$ZIP_PATH" "$archives/"

        feed_token="${UPDATES_TOKEN:-$GH_TOKEN}"
        appcast_loaded=false

        if [[ "$FEED_REPO" == "$CALLER_REPO" ]]; then
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          if git show origin/gh-pages:appcast.xml > "$pages/appcast.xml" 2>/dev/null \
            || git show gh-pages:appcast.xml > "$pages/appcast.xml" 2>/dev/null; then
            echo "Loaded existing appcast from ${FEED_REPO}@gh-pages"
            appcast_loaded=true
          fi
        else
          if GH_TOKEN="$feed_token" gh api \
            "repos/${FEED_REPO}/contents/appcast.xml?ref=gh-pages" \
            --jq .content 2>/dev/null | base64 -d > "$pages/appcast.xml" \
            && [[ -s "$pages/appcast.xml" ]]; then
            echo "Loaded existing appcast from ${FEED_REPO}@gh-pages"
            appcast_loaded=true
          fi
        fi

        if [[ "$appcast_loaded" != true ]]; then
          # Escape XML specials in the stub title.
          title_escaped=$(
            printf '%s' "$APPCAST_TITLE" \
              | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/"/\&quot;/g' -e "s/'/\&apos;/g"
          )
          printf '%s\n' \
            '<?xml version="1.0" standalone="yes"?>' \
            '<rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">' \
            '  <channel>' \
            "    <title>${title_escaped}</title>" \
            '    <language>en</language>' \
            '  </channel>' \
            '</rss>' > "$pages/appcast.xml"
          echo "Created empty appcast stub"
        fi

        download_prior_zip() {
          local release_tag="$1"
          local asset="${ASSET_PREFIX}_${release_tag}.zip"
          if [[ "$DOWNLOAD_REPO" != "$CALLER_REPO" ]]; then
            if GH_TOKEN="${UPDATES_TOKEN:-$GH_TOKEN}" gh release download "$release_tag" \
              --repo "$DOWNLOAD_REPO" --pattern "$asset" --dir "$archives" 2>/dev/null; then
              return 0
            fi
          fi
          if gh release download "$release_tag" \
            --repo "$CALLER_REPO" --pattern "$asset" --dir "$archives" 2>/dev/null; then
            return 0
          fi
          return 1
        }

        list_prior_tags() {
          local repo="$1" token="$2"
          GH_TOKEN="$token" gh release list --repo "$repo" --limit 20 --json tagName,isDraft \
            --jq '.[] | select(.isDraft == false) | .tagName' 2>/dev/null || true
        }

        # Only fetch prior ZIPs when an existing appcast is present. On a stub,
        # generate_appcast --channel would otherwise retag those ZIPs as the
        # current channel (e.g. beta).
        if [[ "$appcast_loaded" == true ]] && command -v gh >/dev/null 2>&1; then
          fetched=0
          while IFS= read -r release_tag; do
            [[ -z "$release_tag" || "$release_tag" == "$TAG" ]] && continue
            if download_prior_zip "$release_tag"; then
              fetched=$((fetched + 1))
            fi
            [[ "$fetched" -ge "$PREVIOUS_COUNT" ]] && break
          done < <(
            {
              if [[ "$DOWNLOAD_REPO" != "$CALLER_REPO" ]]; then
                list_prior_tags "$DOWNLOAD_REPO" "${UPDATES_TOKEN:-$GH_TOKEN}"
              fi
              list_prior_tags "$CALLER_REPO" "$GH_TOKEN"
            } | awk 'NF && !seen[$0]++'
          )
          echo "Fetched $fetched prior ZIP(s) for deltas"
        else
          echo "Skipping prior ZIP fetch (stub appcast or gh unavailable)"
        fi

        echo "SPARKLE_ARCHIVES=$archives" >> "$GITHUB_ENV"
        echo "SPARKLE_PAGES=$pages" >> "$GITHUB_ENV"
        ls -lh "$archives"

    - name: Generate and sign appcast
      id: appcast
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        CHANNEL: ${{ inputs.channel }}
        SPARKLE_PRIVATE_KEY: ${{ inputs.sparkle-private-key }}
        DOWNLOAD_REPO: ${{ steps.meta.outputs.download-repository }}
        CALLER_REPO: ${{ github.repository }}
        ASSET_PREFIX: ${{ inputs.asset-prefix }}
        RELEASE_HTML_URL: ${{ inputs.release-html-url }}
      run: |
        set -euo pipefail

        key_file="$RUNNER_TEMP/sparkle_eddsa_private.key"
        trap 'rm -f "$key_file"' EXIT
        umask 077
        printf '%s\n' "$SPARKLE_PRIVATE_KEY" > "$key_file"

        download_prefix="https://github.com/${DOWNLOAD_REPO}/releases/download/${TAG}/"
        if [[ -n "$RELEASE_HTML_URL" ]]; then
          link_url="$RELEASE_HTML_URL"
        else
          link_url="https://github.com/${CALLER_REPO}/releases/tag/${TAG}"
        fi

        args=(
          --ed-key-file "$key_file"
          --download-url-prefix "$download_prefix"
          --link "$link_url"
          -o "$SPARKLE_PAGES/appcast.xml"
        )

        case "$CHANNEL" in
          stable|"")
            ;;
          beta|alpha)
            args+=(--channel "$CHANNEL")
            ;;
          *)
            echo "Unsupported Sparkle channel: $CHANNEL"
            exit 1
            ;;
        esac

        "$SPARKLE_BIN/generate_appcast" "${args[@]}" "$SPARKLE_ARCHIVES"

        # generate_appcast applies one --download-url-prefix to every archive.
        # Rewrite enclosure URLs so each Prefix_<tag>.zip resolves under that tag
        # on the download repository. Historical enclosures on other hosts are
        # left untouched.
        perl -i -pe \
          's#(url="https://github.com/\Q'"$DOWNLOAD_REPO"'\E/releases/download/)[^/]+/(\Q'"$ASSET_PREFIX"'\E_([^"]+)\.zip")#$1$3/$2#g' \
          "$SPARKLE_PAGES/appcast.xml"

        # Glob of every .delta under the archives dir (includes any prior-release deltas).
        delta_glob="$SPARKLE_ARCHIVES/*.delta"
        echo "appcast-path=$SPARKLE_PAGES/appcast.xml" >> "$GITHUB_OUTPUT"
        echo "delta-glob=$delta_glob" >> "$GITHUB_OUTPUT"
        echo "SPARKLE_DELTA_DIR=$SPARKLE_ARCHIVES" >> "$GITHUB_ENV"

        echo "Appcast head:"
        head -n 60 "$SPARKLE_PAGES/appcast.xml"
