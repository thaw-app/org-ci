name: Export Archive and Package DMG
description: >-
  Export an Xcode archive, notarize and staple the .app, then create a signed
  DMG around the stapled app.

# The app is notarized here rather than only as part of the DMG. Stapling the
# DMG alone leaves the enclosed .app without a ticket, so once a user drags it
# out, Gatekeeper has to reach Apple to check it — and first launch fails
# offline with "cannot check it for malicious software". The DMG is still
# notarized and stapled afterwards by notarize-and-validate; that is two notary
# submissions per build, which is Apple's documented order.

inputs:
  apple-team-id:
    description: Apple Developer Team ID
    required: true
  app-name:
    description: Name of the .app bundle (for example, App.app)
    required: true
  dmg-name:
    description: Name of the output DMG file
    required: true
  archive-path:
    description: Input .xcarchive path
    required: false
    default: build/Archive.xcarchive
  export-path:
    description: xcodebuild -exportPath directory
    required: false
    default: build/Export
  brand-assets-repository:
    description: Public GitHub repo hosting DMG packaging art (owner/name)
    required: false
    default: thaw-app/brand-assets
  brand-assets-ref:
    description: Git ref for brand-assets
    required: false
    default: 13fcae0b1e26f605f6a4f404d1f21d120a65ec64
  brand-assets-background:
    description: Path within brand-assets for the DMG background image
    required: false
    default: packaging/dmg-background@2x.png
  create-dmg-ref:
    description: >-
      Commit SHA of create-dmg/create-dmg to package with. Pinned rather than
      brew-installed: create-dmg runs inside the build that produces the signed,
      attested DMG.
    required: false
    default: a2b71d0fda6d0df2a86dc7f67082d4d73e84c59f # v1.3.0
  dmg-background:
    description: Workspace-relative DMG background path (skips brand-assets fetch when set)
    required: false
    default: ""
  window-width:
    description: create-dmg window width
    required: false
    default: "582"
  window-height:
    description: create-dmg window height
    required: false
    default: "300"
  keychain-path:
    description: Keychain holding the notarytool-profile (must match configure-signing)
    required: false
    default: ""
  notarize-timeout:
    description: Maximum time to wait for the notary service on the .app submission
    required: false
    default: 30m
  notarize-app:
    description: >-
      Notarize and staple the .app before packaging. Only turn this off for
      builds that are never distributed; an unstapled app fails Gatekeeper on
      first launch without network access.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Pinned checkout rather than `brew install create-dmg`: an unpinned formula
    # would run arbitrary versions inside the build that produces the signed DMG.
    # create-dmg locates its support/ directory next to the script, so it runs
    # in place from the checkout.
    - name: Fetch create-dmg
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        repository: create-dmg/create-dmg
        ref: ${{ inputs.create-dmg-ref }}
        path: create-dmg
        # This checkout is read-only, and ./create-dmg/create-dmg runs in this
        # workspace afterwards. A persisted credential would be readable by it.
        persist-credentials: false

    - name: Fetch DMG background from brand-assets
      if: inputs.dmg-background == ''
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        repository: ${{ inputs.brand-assets-repository }}
        ref: ${{ inputs.brand-assets-ref }}
        sparse-checkout: |
          ${{ inputs.brand-assets-background }}
        sparse-checkout-cone-mode: false
        path: brand-assets
        persist-credentials: false

    - name: Export archive and create signed DMG
      shell: bash
      env:
        APPLE_TEAM_ID: ${{ inputs.apple-team-id }}
        APP_NAME: ${{ inputs.app-name }}
        DMG_NAME: ${{ inputs.dmg-name }}
        ARCHIVE_PATH: ${{ inputs.archive-path }}
        EXPORT_PATH: ${{ inputs.export-path }}
        DMG_BACKGROUND_INPUT: ${{ inputs.dmg-background }}
        BRAND_ASSETS_BACKGROUND: ${{ inputs.brand-assets-background }}
        WINDOW_WIDTH: ${{ inputs.window-width }}
        WINDOW_HEIGHT: ${{ inputs.window-height }}
        KEYCHAIN_PATH_INPUT: ${{ inputs.keychain-path }}
        NOTARIZE_TIMEOUT: ${{ inputs.notarize-timeout }}
        NOTARIZE_APP: ${{ inputs.notarize-app }}
      run: |
        set -euo pipefail

        export_plist="$RUNNER_TEMP/ExportOptions.plist"
        rm -f "$export_plist"
        /usr/libexec/PlistBuddy -c "Clear dict" "$export_plist"
        /usr/libexec/PlistBuddy \
          -c "Add :method string developer-id" \
          -c "Add :teamID string $APPLE_TEAM_ID" \
          -c "Add :signingStyle string manual" \
          -c "Add :destination string export" \
          "$export_plist"

        xcodebuild -exportArchive \
          -archivePath "$ARCHIVE_PATH" \
          -exportPath "$EXPORT_PATH" \
          -exportOptionsPlist "$export_plist"

        codesign -vvv --deep --strict "$EXPORT_PATH/$APP_NAME"

        # Notarize and staple the .app *before* it goes into the DMG. A ticket
        # stapled to the DMG does not travel with the app once the user drags it
        # out, so this is what makes offline first launch work.
        if [[ "$NOTARIZE_APP" == "true" ]]; then
          if [[ -n "$KEYCHAIN_PATH_INPUT" ]]; then
            keychain="$KEYCHAIN_PATH_INPUT"
          else
            keychain="$RUNNER_TEMP/buildagent.keychain"
          fi

          app_zip="$RUNNER_TEMP/notarize-app.zip"
          rm -f "$app_zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "$EXPORT_PATH/$APP_NAME" "$app_zip"

          app_submission=$(xcrun notarytool submit "$app_zip" \
            --keychain-profile "notarytool-profile" \
            --keychain "$keychain" \
            --output-format json \
            --timeout "$NOTARIZE_TIMEOUT" \
            --wait)
          echo "$app_submission"

          app_submission_id=$(echo "$app_submission" | jq -r '.id')
          app_status=$(echo "$app_submission" | jq -r '.status')

          if [[ "$app_status" != "Accepted" ]]; then
            echo "App notarization failed with status: $app_status"
            xcrun notarytool log "$app_submission_id" \
              --keychain-profile "notarytool-profile" \
              --keychain "$keychain" || true
            exit 1
          fi

          xcrun stapler staple "$EXPORT_PATH/$APP_NAME"
          xcrun stapler validate "$EXPORT_PATH/$APP_NAME"
        else
          echo "Skipping app notarization (notarize-app=${NOTARIZE_APP})"
        fi

        vol_name="${APP_NAME%.app}"
        staging="$RUNNER_TEMP/dmg-staging"
        if [[ -n "$DMG_BACKGROUND_INPUT" ]]; then
          dmg_bg="$DMG_BACKGROUND_INPUT"
        else
          dmg_bg="brand-assets/$BRAND_ASSETS_BACKGROUND"
        fi

        rm -rf "$staging"
        mkdir -p "$staging"

        cp -R "$EXPORT_PATH/$APP_NAME" "$staging/$APP_NAME"
        ln -s /Applications "$staging/Applications"

        ./create-dmg/create-dmg \
          --volname "$vol_name" \
          --background "$dmg_bg" \
          --window-size "$WINDOW_WIDTH" "$WINDOW_HEIGHT" \
          --icon-size 100 \
          --hide-extension "$APP_NAME" \
          --icon "$APP_NAME" 150 150 \
          --icon "Applications" 436 150 \
          --hdiutil-retries 10 \
          "build/$DMG_NAME" \
          "$staging"

        codesign --sign "Developer ID Application" \
          --timestamp \
          --team-id "$APPLE_TEAM_ID" \
          "build/$DMG_NAME"
