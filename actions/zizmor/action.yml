name: zizmor
description: >-
  Audit the repository's GitHub Actions workflows, composite actions and
  Dependabot config with zizmor, and fail on a finding that is not ignored.
  Uploads SARIF to code scanning, except for pull requests from forks and
  Dependabot. Run it after a checkout.

# The CLI is pinned by version and SHA-256. In the ci-tools image the same
# version is already installed and nothing is downloaded.

inputs:
  paths:
    description: Files or directories to audit, one per line, relative to the workspace
    required: false
    default: .
  persona:
    description: zizmor persona, regular, pedantic or auditor
    required: false
    default: regular
  min-severity:
    description: Leave out findings below this severity (informational, low, medium or high). Empty keeps all.
    required: false
    default: ""
  config:
    description: Path to a zizmor config. Empty finds .github/zizmor.yml or zizmor.yml in the repository.
    required: false
    default: ""
  token:
    description: Token for zizmor's online audits, which read the GitHub API. Empty runs the offline audits only.
    required: false
    default: ${{ github.token }}
  upload-sarif:
    description: >-
      Upload the SARIF report to code scanning. Pull requests from forks and
      Dependabot never upload, since their token cannot write security events.
    required: false
    default: "true"
  sarif-category:
    description: Code scanning category of the upload
    required: false
    default: zizmor
  zizmor-version:
    description: zizmor release to install
    required: false
    default: "1.32.0"
  zizmor-sha256:
    description: SHA-256 of that release's zizmor-x86_64-unknown-linux-gnu.tar.gz, as its release lists it
    required: false
    default: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b

runs:
  using: composite
  steps:
    - name: Install zizmor
      id: install
      shell: bash
      env:
        ZIZMOR_VERSION: ${{ inputs.zizmor-version }}
        ZIZMOR_SHA256_LINUX_X64: ${{ inputs.zizmor-sha256 }}
      run: |
        set -euo pipefail
        if command -v zizmor > /dev/null && [[ "$(zizmor --version)" == "zizmor ${ZIZMOR_VERSION}" ]]; then
          echo "path=$(command -v zizmor)" >> "$GITHUB_OUTPUT"
          zizmor --version
          exit 0
        fi
        if [[ "$RUNNER_OS" != Linux || "$RUNNER_ARCH" != X64 ]]; then
          echo "::error::zizmor is installed for Linux x64 only; this runner is $RUNNER_OS $RUNNER_ARCH"
          exit 1
        fi
        dir="$RUNNER_TEMP/zizmor-bin"
        mkdir -p "$dir"
        archive="$dir/zizmor.tar.gz"
        curl -sSfL --proto '=https' --tlsv1.2 --retry 3 \
          "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
          -o "$archive"
        echo "${ZIZMOR_SHA256_LINUX_X64}  ${archive}" | sha256sum -c -
        tar -xzf "$archive" -C "$dir" zizmor
        echo "path=$dir/zizmor" >> "$GITHUB_OUTPUT"
        "$dir/zizmor" --version

    # This run never fails on findings; the audit step below does.
    - name: Write the SARIF report
      id: sarif
      shell: bash
      env:
        ZIZMOR: ${{ steps.install.outputs.path }}
        PATHS: ${{ inputs.paths }}
        PERSONA: ${{ inputs.persona }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
        CONFIG: ${{ inputs.config }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/run.sh" sarif "$RUNNER_TEMP/zizmor.sarif"

    - name: Audit workflows and actions
      shell: bash
      env:
        ZIZMOR: ${{ steps.install.outputs.path }}
        PATHS: ${{ inputs.paths }}
        PERSONA: ${{ inputs.persona }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
        CONFIG: ${{ inputs.config }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/run.sh" plain

    # Same rule as the caller's SONAR_ENABLED: a fork's pull request and
    # Dependabot get a read-only token, so the upload would fail.
    - name: Upload SARIF
      if: >-
        ${{
          always()
          && !cancelled()
          && steps.sarif.outcome == 'success'
          && inputs.upload-sarif == 'true'
          && github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        }}
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ runner.temp }}/zizmor.sarif
        category: ${{ inputs.sarif-category }}
